<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<script src="webjars/jquery/3.5.1/jquery.min.js"></script>
	<link rel="stylesheet" href="webjars/bootstrap/4.6.0/css/bootstrap.min.css" />
	<script src="webjars/bootstrap/4.6.0/js/bootstrap.min.js"></script>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<title>TodoApp</title>
</head>

<body>

	<h1>TodoList</h1>
	<h3>マイタスク</h3>

	<!-- タスク一覧 -->
	<table class="table table-borderless">
		<tbody id="todes">
			<tr class="todo" th:each="todo : ${todos}">
				<td style="width:2rem">
					<input type="checkbox" name="done_flg" />
					<input type="hidden" name="id" th:value="${todo.id}" />
				</td>
				<td style="width:22rem">
					<input type="text" style="border:none;width:22rem" name="title" th:value="${todo.title}" />
				</td>
				<td>
					<input type="date" style="border:none;width:22rem" name="time_limit"
						th:value="${todo.time_limit}" />
				</td>
			</tr>
		</tbody>
	</table>

	<!-- 完了 -->
	<div style="font-size:20px">
		<span id="done_count"></span>
		<span class="pr-3">件完了</span>
		<span class="button_for_show" style="display:inline-block"></span>
	</div>

	<!-- 完了済み一覧 -->
	<table class="table table-borderless" style="display:none" id="done_table">
		<tbody id="donetodes">
			<tr class="todo" th:each="todo : ${doneTodos}">
				<td style="width:2rem">
					<input type="checkbox" name="done_flg" checked />
					<input type="hidden" name="id" th:value="${todo.id}" />
				</td>
				<td style="width:22rem">
					<input type="text" style="border:none;width:22rem;text-decoration:line-through" name="title"
						th:value="${todo.title}" />
				</td>
				<td>
					<input type="date" style="border:none;display:none" name="time_limit"
						th:value="${todo.time_limit}" />
				</td>
			</tr>
		</tbody>
	</table>

	<!-- モーダルを開くボタン -->
	<button type="button" class="btn btn-light rounded-circle p-0 text-muted font-weight-bold" data-toggle="modal"
		data-target="#modal" style="width:2.5rem;height:2.5rem;">＋</button>

	<!-- モーダルウィンドウ -->
	<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="basicModal" aria-hidden="true">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
				<div class="modal-body" style="position: relative; padding-top: 4rem;">

					<!-- タスク追加ボタン -->
					<button type="button" class="btn btn-primary" id="add"
						style="position: absolute; top: 1rem; right: 1rem;" data-dismiss="modal">
						追加
					</button>
					<!-- フォーム -->
					<form id="add_form" enctype="multipart/form-data">

						<!-- タスクのタイトル入力 -->
						<div class="form-group">
							<input type="text" name="title" class="form-control" placeholder="新しいタスク" />
						</div>

						<!-- 日付 -->
						<div class="form-group">
							<input type="date" name="time_limit" class="form-control" />
						</div>

						<!-- メモ -->
						<div class="form-group">
							<textarea name="memo" class="form-control" placeholder="メモを入力" rows="3"
								maxlength="150"></textarea>
						</div>
						<div class="form-row">

							<!-- 写真 -->
							<div class="col-12 col-md-6">
								<div class="form-group">
									<label for="photo">写真を追加</label>
									<input type="file" name="photo" class="form-control-file" />
								</div>
							</div>

							<div class="col-12 col-md-6">

								<!-- 優先度 -->
								<div class="form-group d-flex align-items-center">
									<label class="mb-0 mr-2" style="min-width:4.5rem;">優先度：</label>
									<div class="form-check form-check-inline mb-0">
										<input class="form-check-input" type="radio" name="priorityStr" value="高"
											id="priorityHigh">
										<label class="form-check-label" for="priorityHigh">高</label>
									</div>
									<div class="form-check form-check-inline mb-0">
										<input class="form-check-input" type="radio" name="priorityStr" value="中"
											id="priorityMedium">
										<label class="form-check-label" for="priorityMedium">中</label>
									</div>
									<div class="form-check form-check-inline mb-0">
										<input class="form-check-input" type="radio" name="priorityStr" value="低"
											id="priorityLow">
										<label class="form-check-label" for="priorityLow">低</label>
									</div>
								</div>

								<!-- カテゴリ -->
								<div class="form-group d-flex align-items-center mt-2">
									<label for="category" class="mb-0 mr-2" style="min-width:4.5rem;">カテゴリ：</label>
									<select name="categoryStr" class="form-control" style="width:70%;">
										<option value="">選択してください</option>
										<option value="仕事">仕事</option>
										<option value="私用">私用</option>
										<option value="その他">その他</option>
									</select>
								</div>

							</div>
						</div>

					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- 完了済み削除 -->
	<button type="button" class="btn btn-outline-secondary" id="delete">完了済みを削除</button>
	<script type="text/javascript" th:src="@{/js/todo.js}"></script>
</body>

</html>
