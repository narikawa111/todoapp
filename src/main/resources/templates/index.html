<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <script src="webjars/jquery/3.5.1/jquery.min.js"></script>
  <link rel="stylesheet" href="webjars/bootstrap/4.6.0/css/bootstrap.min.css" />
  <script src="webjars/bootstrap/4.6.0/js/bootstrap.min.js"></script>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <title>TodoApp</title>
</head>
<body>
  <h1>TodoList</h1>
  <h3>マイタスク</h3>
  <table class="table table-borderless">
    <thead></thead>
    <tbody id="todes">
      <tr class="todo" th:each="todo : ${todos}">
        <td style="width:2rem">
          <input type="checkbox" name="done_flg"/>
          <input type="hidden" name="id" th:value="${todo.id}" />
        </td>
        <td style="width:22rem">
          <input type="text" style="border:none;width:22rem" name="title" th:value="${todo.title}"/>
        </td>
        <td>
          <input type="date" style="border:none" name="time_limit" th:value="${todo.time_limit}" />
        </td>
      </tr>
    </tbody>
  </table>

  <div style="font-size:20px">
    <span id="done_count"></span>
    <span class="pr-3">件完了</span>
    <span class="button_for_show" style="display:inline-block"></span>
  </div>

  <table class="table table-borderless" style="display:none" id="done_table">
    <thead></thead>
    <tbody id="donetodes">
      <tr class="todo" th:each="todo : ${doneTodos}">
        <td style="width:2rem">
          <input type="checkbox" name="done_flg" checked/>
          <input type="hidden" name="id" th:value="${todo.id}" />
        </td>
        <td style="width:22rem">
          <input type="text" style="border:none;width:22rem;text-decoration:line-through" name="title" th:value="${todo.title}"/>
        </td>
        <td>
          <input type="date" style="border:none;display:none" name="time_limit" th:value="${todo.time_limit}" />
        </td>
      </tr>
    </tbody>
  </table>

  <!-- タスク追加ボタン -->
  <button type="button" class="btn btn-light rounded-circle p-0 text-muted font-weight-bold" data-toggle="modal" data-target="#modal" style="width:2.5rem;height:2.5rem;">＋</button>

  <!-- モーダルウィンドウ（タスク追加フォーム） -->
  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="basicModal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <form id="add_form" enctype="multipart/form-data">
            <div class="form-group">
              <input type="text" name="title" class="form-control" placeholder="新しいタスク" />
            </div>
            <div class="form-group">
              <input type="date" name="time_limit" class="form-control" style="width:60%;" />
            </div>
            <!-- カテゴリ -->
            <div class="form-group">
              <label for="category">カテゴリ</label>
              <select name="category" class="form-control">
                <option value="">選択してください</option>
                <option value="仕事">仕事</option>
                <option value="私用">私用</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <!-- 優先度 -->
            <div class="form-group">
              <label>優先度</label><br/>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="priority" value="高" id="priorityHigh">
                <label class="form-check-label" for="priorityHigh">高</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="priority" value="中" id="priorityMedium">
                <label class="form-check-label" for="priorityMedium">中</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="priority" value="低" id="priorityLow">
                <label class="form-check-label" for="priorityLow">低</label>
              </div>
            </div>
            <!-- 写真 -->
            <div class="form-group">
              <label for="photo">写真を追加</label>
              <input type="file" name="photo" class="form-control-file" />
            </div>

            <button type="button" class="btn btn-primary float-right" data-dismiss="modal" id="add">追加</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- 完了済み削除 -->
  <button type="button" class="btn btn-outline-secondary" id="delete">完了済みを削除</button>

  <script type="text/javascript" th:src="@{/js/todo.js}"></script>
</body>
</html>
